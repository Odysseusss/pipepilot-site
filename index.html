<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Pipe Pilot is an isometric piping drawing and field-reference platform currently in development."
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <title>Pipe Pilot | Coming Soon</title>

  <!-- Browser tab icon -->
  <link
    rel="icon"
    type="image/png"
    href="pipe-pilot-favicon.png"
  >

  <!-- iPhone Add to Home Screen icon -->
  <link
    rel="apple-touch-icon"
    sizes="512x512"
    href="pipe-pilot-app-icon.png"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Pipe Pilot"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <style>
    :root {
      --background: #07111f;
      --panel: rgba(15, 32, 53, 0.86);
      --blue: #27a7ff;
      --light-blue: #83d1ff;
      --text: #f4f8fc;
      --muted: #9fb0c2;
      --border: rgba(131, 209, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(39, 167, 255, 0.18),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          #040a12,
          var(--background)
        );
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;

      content: "";
      opacity: 0.28;

      background-image:
        linear-gradient(
          rgba(39, 167, 255, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(39, 167, 255, 0.08) 1px,
          transparent 1px
        );

      background-size: 44px 44px;
      transform: skewY(-4deg) scale(1.1);
    }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;

      padding:
        max(32px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    .card {
      width: min(780px, 100%);
      padding: 52px 42px;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: var(--panel);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.42),
        inset 0 1px rgba(255, 255, 255, 0.04);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .wordmark {
      display: block;
      width: min(590px, 100%);
      height: auto;

      margin: 0 auto 24px;

      object-fit: contain;

      filter:
        drop-shadow(0 18px 24px rgba(0, 0, 0, 0.42))
        drop-shadow(0 0 18px rgba(39, 167, 255, 0.18));
    }

    .visually-hidden {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;

      border: 0;
    }

    .eyebrow {
      margin-bottom: 14px;

      color: var(--light-blue);

      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .tagline {
      max-width: 580px;
      margin: 0 auto;

      color: var(--muted);

      font-size: clamp(1rem, 2.8vw, 1.2rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin: 30px 0;
      padding: 10px 16px;

      color: #cdeeff;

      font-size: 0.88rem;
      font-weight: 600;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(39, 167, 255, 0.07);
    }

    .status-dot {
      width: 9px;
      height: 9px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--blue);
      box-shadow: 0 0 12px var(--blue);
    }

    .button {
      display: inline-block;

      padding: 14px 22px;

      color: #03101b;

      font-weight: 750;
      text-decoration: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          var(--light-blue),
          var(--blue)
        );

      box-shadow:
        0 12px 30px rgba(39, 167, 255, 0.2);

      transition:
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 16px 36px rgba(39, 167, 255, 0.28);
    }

    .button:focus-visible {
      outline: 3px solid rgba(131, 209, 255, 0.7);
      outline-offset: 4px;
    }

    footer {
      margin-top: 42px;

      color: #73879b;

      font-size: 0.78rem;
    }

    @media (max-width: 560px) {
      main {
        padding:
          max(20px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      .card {
        padding: 38px 22px;
        border-radius: 18px;
      }

      .wordmark {
        width: 100%;
        margin-bottom: 22px;
      }

      .status {
        padding: 9px 13px;
        font-size: 0.77rem;
      }

      footer {
        margin-top: 34px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <img
        class="wordmark"
        src="pipe-pilot-wordmark.png"
        alt="Pipe Pilot"
      >

      <h1 class="visually-hidden">
        Pipe Pilot
      </h1>

      <p class="eyebrow">
        Built for the pipe trades
      </p>

      <p class="tagline">
        Isometric piping drawings, field references and fitting
        intelligence—built into one practical platform.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Development in progress · Coming soon
      </div>

      <br>

      <a
        class="button"
        href="mailto:craig@pipepilotapp.com"
      >
        Contact Pipe Pilot
      </a>

      <footer>
        © 2026 Pipe Pilot. All rights reserved.
      </footer>
    </section>
  </main>
</body>
</html>
